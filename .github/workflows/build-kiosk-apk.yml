name: Build Matylda House APK

on:
  workflow_dispatch:
  push:
    paths:
      - "matylda_house_kiosk_backend/**"
      - ".github/workflows/build-kiosk-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./matylda_house_kiosk_backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project structure
        run: |
          echo "Android project directory:"
          pwd

          echo "Directory contents:"
          ls -la

          test -f settings.gradle || {
            echo "::error::settings.gradle was not found"
            exit 1
          }

          test -f build.gradle || {
            echo "::error::build.gradle was not found"
            exit 1
          }

          test -f app/build.gradle || {
            echo "::error::app/build.gradle was not found"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Restore signing key
        env:
          KIOSK_KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KIOSK_KEYSTORE_BASE64" ]; then
            echo "::error::KIOSK_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          printf '%s' "$KIOSK_KEYSTORE_BASE64" \
            | base64 --decode \
            > kiosk-release.jks

          test -s kiosk-release.jks || {
            echo "::error::The restored keystore is empty"
            exit 1
          }

          chmod 600 kiosk-release.jks

      - name: Build signed release APK
        env:
          KIOSK_KEYSTORE_PATH: ${{ github.workspace }}/matylda_house_kiosk_backend/kiosk-release.jks
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_KEY_ALIAS: ${{ secrets.KIOSK_KEY_ALIAS }}
          KIOSK_KEY_PASSWORD: ${{ secrets.KIOSK_KEY_PASSWORD }}
        run: |
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify and rename APK
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="app/build/outputs/apk/release/Matylda-House.apk"

          test -f "$APK_SOURCE" || {
            echo "::error::Expected APK was not generated"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          }

          cp "$APK_SOURCE" "$APK_TARGET"
          ls -lh "$APK_TARGET"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matylda-House-APK
          path: matylda_house_kiosk_backend/app/build/outputs/apk/release/Matylda-House.apk
          if-no-files-found: error
          retention-days: 30